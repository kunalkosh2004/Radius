[project]
name = "radius-backend"
version = "0.1.0"
description = "Backend for Radius"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.35.0",
    "sqlalchemy>=2.0.43",
    "alembic>=1.16.4",
    "asyncpg>=0.30.0",
    "redis>=6.4.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "geoalchemy2>=0.18.0",
    "shapely>=2.0.0",
    "greenlet>=3.5.4",
    "anyio>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
